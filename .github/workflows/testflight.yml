# Duello — build the Capacitor iOS wrapper and upload to TestFlight.
#
# Setup needed before the first run (all in the repo's
# Settings -> Secrets and variables -> Actions):
#   APP_STORE_CONNECT_API_KEY_ID       (done — 'Duello CI' key)
#   APP_STORE_CONNECT_ISSUER_ID        (done)
#   APP_STORE_CONNECT_API_KEY_P8       (done — full .p8, BEGIN/END lines included)
#   IOS_CERTIFICATE_P12                (base64 of the exported distribution .p12)
#   IOS_CERTIFICATE_PASSWORD           (password set when exporting the .p12)
#   IOS_PROVISIONING_PROFILE           (base64 of the App Store .mobileprovision)
#   IOS_PROVISIONING_PROFILE_NAME      (profile name as shown on the developer portal)
# Team ID JP6TX47769 is hardcoded below (not secret).
#
# Design notes:
# - No shared .xcscheme exists in the repo, so archive uses -target App, not -scheme.
# - Build number is github.run_number + 1: Build 1 (manual, Xcode) already used
#   build number 1, so the first pipeline run must be 2. Run numbers only go up,
#   so build numbers stay unique and TestFlight accepts every upload.
# - The export step renames whatever .ipa xcodebuild produces to Duello.ipa,
#   because the Xcode product is named "App" and the exported file may be App.ipa.
# - The workflow itself is not in the push paths, so adding it does not trigger a run.
#   First run is manual: Actions tab -> this workflow -> Run workflow.

name: Build and upload to TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/duello.mobileprovision"

      - name: Build archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Duello.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="JP6TX47769" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}" \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 1 )) \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>JP6TX47769</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.duellogame.app</key><string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Duello.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mv "$RUNNER_TEMP/export"/*.ipa "$RUNNER_TEMP/Duello.ipa"
          ls -la "$RUNNER_TEMP/Duello.ipa"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/Duello.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
